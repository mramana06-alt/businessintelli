<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Business Intelli Solutions · Technology services and workforce solutions</title>
  <meta name="description" content="Business Intelli Solutions Inc. is a technology services and workforce solutions company headquartered in Dallas, Texas. It helps organizations find and scale technology talent, build offshore engineering teams in India, and deliver digital engineering, cloud, data and AI work — including AI agents that take on routine multi-step work.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232D4BE0'/%3E%3Cpath d='M9 22 16 8l7 14M12 17h8' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/platform.css">
  <link rel="stylesheet" href="assets/css/blocks.css">
</head>
<body>
  <header class="pbar" id="pbar" aria-label="Platform controls">
    <div class="pb-brand">
      <span class="pb-logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M9 22 16 8l7 14M12 17h8" stroke="#0b1020" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="pb-name"><strong>Agentic Web</strong><small>Experience Platform · prototype</small></span>
    </div>
    <div class="pb-mid">
      <label class="pb-field"><span>Organization</span><select id="pbOrg" aria-label="Organization"></select></label>
      <div class="pb-field"><span>UX flavor</span><button type="button" class="pb-flavor" id="pbFlavor" aria-haspopup="dialog" aria-expanded="false"></button></div>
      <span class="pb-engine" id="pbEngine" title="Understanding engine">Local</span>
    </div>
    <div class="pb-right">
      <button type="button" class="pb-btn" id="pbTrace" aria-pressed="false" title="Agent trace (T)"></button>
      <button type="button" class="pb-btn" id="pbStudio" aria-pressed="false" title="Experience studio (S)"></button>
      <button type="button" class="pb-btn icon-only" id="pbCollapse" title="Hide platform bar"></button>
    </div>
  </header>
  <div class="pbar-slim" id="pbSlim" hidden>
    <span><span class="pb-logo" aria-hidden="true"><svg viewBox="0 0 32 32" width="16" height="16"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M9 22 16 8l7 14M12 17h8" stroke="#0b1020" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Agentic Web · prototype</span>
    <button type="button" class="pbar-reveal" id="pbReveal" title="Show the platform bar">Platform controls</button>
  </div>
  <div class="acct" id="acct" aria-label="Account"></div>

  <main id="stage" class="stage"></main>

  <aside class="drawer" id="traceDrawer" aria-label="Agent trace" hidden></aside>
  <aside class="drawer" id="studioDrawer" aria-label="Experience studio" hidden></aside>
  <div class="flavor-pop" id="flavorPop" role="dialog" aria-label="Choose a UX flavor" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <noscript><p style="padding:24px">Business Intelli Solutions needs JavaScript. </p></noscript>
  <script src="site-data.js"></script>
  <script src="app.bundle.js"></script>
</body>
</html>
